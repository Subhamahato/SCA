<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | Subham Coaching Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

    <style>
        :root {
            --primary: #4facfe; --primary-dark: #00f2fe;
            --bg-main: #f3f4f6;
            --bg-gradient: radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, transparent 50%);
            --bg-appbar: rgba(255, 255, 255, 0.85); --bg-card: rgba(255, 255, 255, 0.85); --bg-modal: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1); --text-main: #1f2937; --text-muted: #6b7280;
            --item-bg: rgba(0, 0, 0, 0.05); --btn-bg: rgba(0, 0, 0, 0.05); --shadow-color: rgba(0, 0, 0, 0.05);
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --solid-bg: #f9fafb;
        }

        .dark {
            --bg-main: #0f172a;
            --bg-gradient: radial-gradient(at 0% 0%, hsla(253,16%,15%,0.3) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,40%,0.1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,40%,0.1) 0, transparent 50%);
            --bg-appbar: rgba(15, 23, 42, 0.85); --bg-card: rgba(30, 41, 59, 0.75); --bg-modal: linear-gradient(135deg, #1e293b, #0f172a);
            --border-color: rgba(255, 255, 255, 0.1); --text-main: #f1f5f9; --text-muted: #94a3b8;
            --item-bg: rgba(0, 0, 0, 0.2); --btn-bg: rgba(255, 255, 255, 0.1); --shadow-color: rgba(0, 0, 0, 0.3);
            --success: #00e676; --warning: #ffb300; --danger: #ff4d4d; --solid-bg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; display: none; }
        
        /* Wider container for tables */
        .app-container { width: 100%; max-width: 1000px; margin: 0 auto; min-height: 100vh; position: relative; overflow-x: hidden; padding-bottom: 40px; }
        
        .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--bg-appbar); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; }
        .brand-title { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
        .brand-subtitle { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; line-height: 1; }
        .brand-main { font-size: 1.1rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .theme-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--primary); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .theme-btn:active { transform: scale(0.95); }
        .profile-trigger { width: 40px; height: 40px; background: rgba(239, 68, 68, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid rgba(239, 68, 68, 0.3); transition: 0.2s; color: var(--danger); font-size: 1.2rem; }

        .content { padding: 20px 25px; }

        /* Quick Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px var(--shadow-color); text-align: center; }
        .stat-card .value { font-size: 1.4rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Tab Navigation */
        .tabs-wrapper { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .tab-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Excel-like Table Styling */
        .table-wrapper { width: 100%; overflow-x: auto; max-height: 65vh; overflow-y: auto; background: var(--bg-modal); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 24px 0 var(--shadow-color); position: relative; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; white-space: nowrap; text-align: left; }
        .admin-table th { position: sticky; top: 0; background: var(--solid-bg); z-index: 10; padding: 8px 12px; color: var(--text-muted); border-bottom: 2px solid var(--border-color); box-shadow: 0 1px 0 var(--border-color); vertical-align: top; }
        .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); vertical-align: middle; }
        .admin-table tbody tr:hover { background: var(--item-bg); }
        .admin-table th:first-child, .admin-table td:first-child { position: sticky; left: 0; background: var(--solid-bg); z-index: 11; border-right: 1px solid var(--border-color); font-weight: 600; }
        .admin-table th:first-child { z-index: 12; }

        /* Excel Filter Inputs */
        .th-top { display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; transition: color 0.2s; }
        .th-top:hover { color: var(--primary); }
        .sort-icon { margin-left: 8px; font-size: 0.75rem; color: var(--border-color); }
        .col-filter { width: 100%; margin-top: 8px; padding: 6px; font-size: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-family: inherit; font-weight: normal; outline: none; cursor: pointer; }
        .col-filter:focus { border-color: var(--primary); }

        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

        .lib-btn { background: linear-gradient(to right, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; padding: 12px 25px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; transition: transform 0.2s; }
        .lib-btn:active { transform: scale(0.97); }

        .loader { text-align: center; padding: 40px; color: var(--primary); font-size: 1.8rem; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<div class="app-container">
    <header class="app-bar">
        <div class="brand-title">
            <span class="brand-subtitle">Subham Coaching Academy</span>
            <div class="brand-main"><i class="fa-solid fa-user-tie"></i> Admin Panel</div>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="theme-btn"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
            <div class="profile-trigger" onclick="adminLogout()" title="Logout"><i class="fa-solid fa-power-off"></i></div>
        </div>
    </header>

    <main class="content">
        
        <!-- Library Portal Button -->
        <button class="lib-btn" onclick="secureLibraryLogin()">
            <i class="fa-solid fa-book-bookmark"></i> Access Library Portal
        </button>

        <!-- Top Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="stat-students"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:1rem;"></i></div>
                <div class="label" style="color:var(--primary);">Active Students</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-dues"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:1rem;"></i></div>
                <div class="label" style="color:var(--danger);">Total Dues (₹)</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-advance"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:1rem;"></i></div>
                <div class="label" style="color:var(--success);">Total Advance (₹)</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs-wrapper">
            <button class="tab-btn active" onclick="switchTab('fees', this)"><i class="fa-solid fa-file-invoice-dollar"></i> Fee Analytics</button>
            <button class="tab-btn" onclick="switchTab('roster', this)"><i class="fa-solid fa-users"></i> Directory</button>
            <button class="tab-btn" onclick="switchTab('attendance', this)"><i class="fa-solid fa-clipboard-user"></i> Attendance Grid</button>
            <button class="tab-btn" onclick="switchTab('results', this)"><i class="fa-solid fa-award"></i> Results Matrix</button>
            <button class="tab-btn" onclick="switchTab('syllabus', this)"><i class="fa-solid fa-bars-progress"></i> Syllabus Tracking</button>
        </div>

        <!-- TAB 1: FEE ANALYTICS -->
        <div id="tab-fees" class="tab-content active">
            <div class="table-wrapper" id="table-fees"><div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>
        </div>

        <!-- TAB 2: ROSTER DIRECTORY -->
        <div id="tab-roster" class="tab-content">
            <div class="table-wrapper" id="table-roster"></div>
        </div>

        <!-- TAB 3: ATTENDANCE GRID -->
        <div id="tab-attendance" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div style="font-size:0.85rem; color:var(--text-muted);"><i class="fa-solid fa-calendar-days"></i> Full monthly attendance register.</div>
                <button onclick="fetchAdminAttendance()" style="background:var(--btn-bg); border:1px solid var(--border-color); color:var(--text-main); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.75rem;"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </div>
            <div class="table-wrapper" id="table-attendance">
                <div class="loader" id="att-loader" style="display:none;"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                <div id="att-content" style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">Click refresh to load attendance grid.</div>
            </div>
        </div>

        <!-- TAB 4: RESULTS MATRIX -->
        <div id="tab-results" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div style="font-size:0.85rem; color:var(--text-muted);"><i class="fa-solid fa-square-poll-vertical"></i> Master overview of all academic test results.</div>
                <button onclick="fetchAdminResults()" style="background:var(--btn-bg); border:1px solid var(--border-color); color:var(--text-main); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.75rem;"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </div>
            <div class="table-wrapper" id="table-results">
                <div class="loader" id="res-loader" style="display:none;"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                <div id="res-content" style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">Click refresh to load academic results.</div>
            </div>
        </div>
        
        <!-- TAB 5: SYLLABUS MATRIX -->
        <div id="tab-syllabus" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <select id="syllabus-selector" onchange="renderSelectedSyllabus()" style="background:var(--bg-modal); border:1px solid var(--border-color); color:var(--text-main); padding:8px; border-radius:8px; font-size:0.85rem; outline:none; max-width:60%;">
                    <option value="">Loading Groups...</option>
                </select>
                <button onclick="fetchAdminSyllabus()" style="background:var(--btn-bg); border:1px solid var(--border-color); color:var(--text-main); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.75rem;"><i class="fa-solid fa-rotate-right"></i> Fetch</button>
            </div>
            <div class="table-wrapper" id="table-syllabus">
                <div class="loader" id="syl-loader" style="display:none;"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                <div id="syl-content" style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">Select a Group & Subject from the dropdown to view.</div>
            </div>
        </div>

    </main>
</div>

<script>
    // --- AUTHENTICATION CHECK ---
    const adminAuthStr = sessionStorage.getItem('adminAuth');
    if (!adminAuthStr) window.location.replace('index.html'); 
    else document.addEventListener('DOMContentLoaded', () => { document.body.style.display = 'block'; }); 

    // --- THEME ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function updateThemeUI(isDark) { themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon'; themeIcon.style.color = isDark ? '#fbbf24' : ''; }
    updateThemeUI(document.documentElement.classList.contains('dark'));
    themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeUI(isDark);
    });

    // --- CONFIGURE API HERE ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPuQFsaVGDBhRJtEXDZmHqpWHPDzeayK47PEbYG46_TVVxn8otZ2Da5IynpHn8PZA/exec'; 

    let allStudentsData = [];
    let globalSyllabusDb = {};
    let attLoaded = false; let resLoaded = false; let sylLoaded = false;

    function adminLogout() {
        if(confirm('Log out of Admin Panel?')) {
            sessionStorage.removeItem('adminAuth');
            window.location.replace('index.html');
        }
    }

    function secureLibraryLogin() {
        sessionStorage.setItem('libraryAuthToken', 'true');
        window.location.href = 'library.html';
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        btn.classList.add('active');
        
        if(tabId === 'attendance' && !attLoaded) fetchAdminAttendance();
        if(tabId === 'results' && !resLoaded) fetchAdminResults();
        if(tabId === 'syllabus' && !sylLoaded) fetchAdminSyllabus();
    }

    // --- EXCEL-LIKE INTERACTIVE TABLE SCRIPT ---
    function makeTableInteractive(tableId) {
        const table = document.querySelector(`#${tableId} table`);
        if (!table) return;
        
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');
        const headers = Array.from(thead.querySelectorAll('th'));
        let rows = Array.from(tbody.querySelectorAll('tr'));
        
        headers.forEach((th, colIndex) => {
            const originalText = th.innerText.trim();
            th.innerHTML = '';
            
            // 1. Setup Sorting UI
            const topDiv = document.createElement('div');
            topDiv.className = 'th-top';
            topDiv.innerHTML = `<span>${originalText}</span> <i class="fa-solid fa-sort sort-icon"></i>`;
            th.appendChild(topDiv);
            
            // 2. Setup Sorting Logic
            let asc = true;
            topDiv.addEventListener('click', () => {
                rows.sort((a, b) => {
                    let aVal = a.cells[colIndex].innerText.trim();
                    let bVal = b.cells[colIndex].innerText.trim();
                    
                    // Smart Date Parsing
                    function parseDate(v) {
                        let p = v.split('/');
                        if(p.length === 3) return new Date(p[2], p[1]-1, p[0]).getTime();
                        return null;
                    }
                    let d1 = parseDate(aVal), d2 = parseDate(bVal);
                    if(d1 && d2) return asc ? d1 - d2 : d2 - d1;

                    // Smart Number Parsing (Strips ₹, +, etc.)
                    let n1 = parseFloat(aVal.replace(/[^0-9.-]+/g,""));
                    let n2 = parseFloat(bVal.replace(/[^0-9.-]+/g,""));
                    if(!isNaN(n1) && !isNaN(n2)) return asc ? n1 - n2 : n2 - n1;
                    
                    return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                });
                asc = !asc;
                
                // Update Icons and DOM
                headers.forEach(h => { let i = h.querySelector('.sort-icon'); if(i) { i.className = 'fa-solid fa-sort sort-icon'; i.style.color = 'var(--border-color)'; } });
                let currentIcon = topDiv.querySelector('.sort-icon');
                currentIcon.className = asc ? 'fa-solid fa-sort-up sort-icon' : 'fa-solid fa-sort-down sort-icon';
                currentIcon.style.color = 'var(--primary)';
                rows.forEach(r => tbody.appendChild(r)); // Reorder DOM
            });

            // 3. Setup Filter Dropdown UI (Excluding specific unique columns)
            const excludeFilters = ['id', 'name', 'ch. no', 'chapter title', 'student', 'test'];
            const shouldExclude = excludeFilters.some(kw => originalText.toLowerCase().includes(kw));

            if (!shouldExclude) {
                let uniqueVals = [...new Set(rows.map(r => r.cells[colIndex].innerText.trim()))].filter(v => v !== '');
                if(uniqueVals.length > 0) {
                    let sel = document.createElement('select');
                    sel.className = 'col-filter';
                    sel.innerHTML = `<option value="">All</option>` + uniqueVals.sort().map(v => `<option value="${v}">${v}</option>`).join('');
                    
                    // Filtering Logic
                    sel.addEventListener('change', () => {
                        let filters = Array.from(thead.querySelectorAll('.col-filter'));
                        rows.forEach(r => {
                            let show = true;
                            // Need to map the filter elements back to their true column indices
                            filters.forEach(f => {
                                if(f.value) {
                                    let parentTh = f.closest('th');
                                    let targetColIndex = Array.from(thead.querySelectorAll('th')).indexOf(parentTh);
                                    if (r.cells[targetColIndex].innerText.trim() !== f.value) show = false;
                                }
                            });
                            r.style.display = show ? '' : 'none';
                        });
                    });
                    th.appendChild(sel);
                }
            }
        });
    }

    // --- 1. INITIALIZE DASHBOARD (FETCH ALL STUDENTS) ---
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getAllStudents" }) });
            const result = await response.json();
            if(result.status === 'success') {
                allStudentsData = result.data;
                document.getElementById('stat-students').innerText = allStudentsData.length;
                processRosterAndFees();
            }
        } catch (e) { alert("Connection error."); }
    });

    function parseDateDDMMYYYY(dateStr) {
        if (!dateStr) return null;
        const p = dateStr.trim().split('/');
        if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]);
        return null;
    }

    // --- 2. PROCESS FEES & ROSTER TABLES ---
    function processRosterAndFees() {
        let totalDuesSum = 0; let totalAdvanceSum = 0;
        const today = new Date(); today.setHours(0,0,0,0);

        allStudentsData.forEach(st => {
            const monthlyFee = parseFloat(st['Monthly Tuition Fee']) || 0;
            const lastPaid = parseFloat(st['Last Fee Paid Amount']) || 0;
            const paidUpToStr = st['Fee Paid Up To'];
            const paidUpToDate = parseDateDDMMYYYY(paidUpToStr) || new Date(0);
            
            if (parseDateDDMMYYYY(paidUpToStr)) {
                let monthsDue = 0;
                let checkDate = new Date(paidUpToDate); checkDate.setMonth(checkDate.getMonth() + 1);
                while (today >= checkDate) { monthsDue++; checkDate.setMonth(checkDate.getMonth() + 1); }
                const pendingLast = monthlyFee - lastPaid;
                let totalDue = (monthsDue * monthlyFee) + pendingLast;
                st.calculatedDue = totalDue;
                if (totalDue > 0) totalDuesSum += totalDue;
                if (totalDue < 0) totalAdvanceSum += Math.abs(totalDue);
            } else { st.calculatedDue = 0; }
        });

        document.getElementById('stat-dues').innerText = totalDuesSum;
        document.getElementById('stat-advance').innerText = totalAdvanceSum;

        // Render Fee Analytics
        let feeHtml = `<table class="admin-table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Batch</th><th>Group</th><th>Monthly Fee</th><th>Paid Up To</th><th>Outstanding</th><th>Status</th></tr></thead><tbody>`;
        allStudentsData.forEach(st => {
            let due = st.calculatedDue || 0;
            let statusBadge = due > 0 ? `<span class="badge badge-danger">Defaulter</span>` : (due < 0 ? `<span class="badge badge-success">Advance</span>` : `<span class="badge badge-success">Cleared</span>`);
            let dueText = due > 0 ? `₹${due}` : (due < 0 ? `+₹${Math.abs(due)}` : `₹0`);
            feeHtml += `<tr><td>${st['Student ID']||'-'}</td><td>${st['Student Name']||'-'}</td><td>${st['Class']||'-'}</td><td>${st['Batch']||'-'}</td><td>${st['Group']||'-'}</td><td>₹${st['Monthly Tuition Fee']||'0'}</td><td>${st['Fee Paid Up To']||'-'}</td><td>${dueText}</td><td>${statusBadge}</td></tr>`;
        });
        feeHtml += `</tbody></table>`;
        document.getElementById('table-fees').innerHTML = feeHtml;
        makeTableInteractive('table-fees');

        // Render Directory
        let rosterHtml = `<table class="admin-table"><thead><tr><th>ID</th><th>Name</th><th>Batch</th><th>Group</th><th>Class</th><th>School</th><th>Admission Date</th></tr></thead><tbody>`;
        allStudentsData.forEach(st => {
            rosterHtml += `<tr><td>${st['Student ID']||'-'}</td><td>${st['Student Name']||'-'}</td><td>${st['Batch']||'-'}</td><td>${st['Group']||'-'}</td><td>${st['Class']||'-'}</td><td>${st['School']||'-'}</td><td>${st['Admission Date']||'-'}</td></tr>`;
        });
        rosterHtml += `</tbody></table>`;
        document.getElementById('table-roster').innerHTML = rosterHtml;
        makeTableInteractive('table-roster');
    }

    // --- 3. FETCH FULL ATTENDANCE GRID ---
    async function fetchAdminAttendance() {
        document.getElementById('att-content').style.display = 'none'; document.getElementById('att-loader').style.display = 'block';
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getAllAttendance", tabName: "" }) });
            const result = await response.json();
            document.getElementById('att-loader').style.display = 'none'; document.getElementById('att-content').style.display = 'block';

            if(result.status === 'success' && result.data.length > 0) {
                attLoaded = true; const data = result.data;
                let html = `<table class="admin-table"><thead><tr>`;
                
                // Construct Headers and inject "Batch" after Student ID
                data[0].forEach((header, idx) => { 
                    html += `<th>${header}</th>`; 
                    if (idx === 0) html += `<th>Batch</th>`;
                });
                html += `</tr></thead><tbody>`;
                
                // Construct Rows
                for(let i=1; i<data.length; i++) {
                    html += `<tr>`;
                    data[i].forEach((cell, idx) => {
                        let colorStyle = ''; let val = cell.trim().toUpperCase();
                        if(val === 'P') colorStyle = 'color:var(--success); font-weight:700;';
                        if(val === 'A') colorStyle = 'color:var(--danger); font-weight:700;';
                        if(val === 'H' || val === 'E') colorStyle = 'color:var(--warning); font-weight:700;';
                        
                        html += `<td style="${colorStyle}">${cell}</td>`;
                        
                        // Inject Batch Data
                        if (idx === 0) {
                            let stObj = allStudentsData.find(s => s['Student ID'] === data[i][0]);
                            html += `<td>${stObj ? (stObj['Batch'] || '-') : '-'}</td>`;
                        }
                    });
                    html += `</tr>`;
                }
                html += `</tbody></table>`;
                document.getElementById('att-content').innerHTML = html;
                document.getElementById('att-content').style.padding = '0';
                makeTableInteractive('att-content');
            } else { document.getElementById('att-content').innerText = result.message || "No attendance data found."; }
        } catch (e) {}
    }

    // --- 4. FETCH FULL RESULTS GRID ---
    async function fetchAdminResults() {
        document.getElementById('res-content').style.display = 'none'; document.getElementById('res-loader').style.display = 'block';
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getAllResults" }) });
            const result = await response.json();
            document.getElementById('res-loader').style.display = 'none'; document.getElementById('res-content').style.display = 'block';

            if(result.status === 'success' && result.data.length > 0) {
                resLoaded = true; const data = result.data;
                let html = `<table class="admin-table"><thead>`;
                html += `<tr>`; data[0].forEach(d => html += `<th>${d}</th>`); html += `</tr>`;
                // Combine Dates and Subjects for datatable display structure
                html += `</thead><tbody>`;
                for(let i=1; i<data.length; i++) {
                    html += `<tr>`;
                    data[i].forEach((cell, idx) => {
                        let style = '';
                        if(i > 1 && idx > 0 && cell.includes('/')) {
                            let p = cell.split('/'); let pct = Math.round((parseFloat(p[0]) / parseFloat(p[1])) * 100);
                            style = pct >= 70 ? 'color:var(--success); font-weight:600;' : (pct >= 40 ? 'color:var(--warning); font-weight:600;' : 'color:var(--danger); font-weight:600;');
                        } else if (i === 1) style = 'font-weight:700; color:var(--primary);'; 
                        html += `<td style="${style}">${cell || '-'}</td>`;
                    });
                    html += `</tr>`;
                }
                html += `</tbody></table>`;
                document.getElementById('res-content').innerHTML = html;
                document.getElementById('res-content').style.padding = '0';
                makeTableInteractive('res-content');
            }
        } catch (e) {}
    }

    // --- 5. FETCH SYLLABUS MATRIX ---
    async function fetchAdminSyllabus() {
        document.getElementById('syl-content').style.display = 'none'; document.getElementById('syl-loader').style.display = 'block';
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getAllSyllabus" }) });
            const result = await response.json();
            document.getElementById('syl-loader').style.display = 'none'; document.getElementById('syl-content').style.display = 'block';

            if(result.status === 'success') {
                sylLoaded = true; globalSyllabusDb = result.data;
                const selector = document.getElementById('syllabus-selector');
                selector.innerHTML = `<option value="">Select Group/Subject</option>`;
                Object.keys(globalSyllabusDb).forEach(sheetName => {
                    selector.innerHTML += `<option value="${sheetName}">${sheetName.replace('_', ' - ')}</option>`;
                });
                document.getElementById('syl-content').innerText = "Please select a group from the dropdown above.";
            }
        } catch (e) {}
    }

    function renderSelectedSyllabus() {
        const selected = document.getElementById('syllabus-selector').value;
        const container = document.getElementById('syl-content');
        if(!selected) { container.innerHTML = "Please select a group."; container.style.padding = '20px'; return; }
        
        const chapters = globalSyllabusDb[selected];
        let html = `<table class="admin-table"><thead><tr><th>Ch. No</th><th>Chapter Title</th><th>Status</th></tr></thead><tbody>`;
        
        chapters.forEach(ch => {
            let statStyle = '';
            if(ch.status.toLowerCase() === 'completed') statStyle = `<span class="badge badge-success"><i class="fa-solid fa-check"></i> ${ch.status}</span>`;
            else if(ch.status.toLowerCase() === 'ongoing') statStyle = `<span class="badge badge-warning"><i class="fa-solid fa-spinner fa-spin"></i> ${ch.status}</span>`;
            else statStyle = `<span class="badge badge-danger"><i class="fa-solid fa-clock"></i> ${ch.status}</span>`;
            
            html += `<tr><td>${ch.chapter}</td><td style="white-space:normal; min-width:200px;">${ch.title}</td><td>${statStyle}</td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
        container.style.padding = '0';
        makeTableInteractive('syl-content');
    }
</script>
