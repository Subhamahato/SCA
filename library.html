<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subham Coaching Academy - Study Materials</title>
    
    <!-- STRICT AUTHENTICATION LAYER -->
    <script>
        const loggedInStudent = sessionStorage.getItem('loggedInStudent');
        const adminAuth = sessionStorage.getItem('adminAuth');
        const libraryAuthToken = sessionStorage.getItem('libraryAuthToken');
        
        // Block access if neither is logged in OR if the strict token is missing
        if ((!loggedInStudent && !adminAuth) || libraryAuthToken !== 'true') {
            // Smart routing: Send them back to their specific dashboard if token is missing
            if (adminAuth) {
                window.location.replace('admin_dashboard.html');
            } else if (loggedInStudent) {
                window.location.replace('dashboard.html');
            } else {
                window.location.replace('index.html');
            }
        } else {
            // DESTROY TOKEN INSTANTLY to prevent direct URL sharing or page refreshes
            sessionStorage.removeItem('libraryAuthToken');
            
            // Create a safe 'studentData' object so the library page doesn't crash when Admin views it
            window.studentData = loggedInStudent 
                ? JSON.parse(loggedInStudent) 
                : { 'Student Name': 'Admin (Subham Sir)', 'Class': 'All', 'Group': 'Admin' };
        }
    </script>
    <!-- END AUTHENTICATION LAYER -->

    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configure Tailwind for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .dark body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,15%,0.3) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,40%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,40%,0.1) 0, transparent 50%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.1);
        }

        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Loading Spinner Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* -------------------------------------------
           Fullscreen Viewer UI Overrides 
           ------------------------------------------- */
        /* Make header transparent and floating in Fullscreen */
        #pdfViewerSection.is-fullscreen #pdfViewerHeader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: transparent !important;
            box-shadow: none !important;
            pointer-events: none; /* Let clicks pass through empty header space */
            padding-top: 1rem;
            padding-right: 1rem;
        }
        
        /* Hide the title completely */
        #pdfViewerSection.is-fullscreen #pdfViewerTitleContainer {
            opacity: 0;
            pointer-events: none;
        }

        /* Show the toggle button */
        #pdfViewerSection.is-fullscreen #toggleControlsBtn {
            display: flex !important;
            pointer-events: auto; /* Re-enable clicking */
        }
        
        /* Style the expanded controls box for floating appearance */
        #pdfViewerSection.is-fullscreen #pdfControlsWrapper {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85); /* Slate 900 */
            backdrop-filter: blur(12px);
            padding: 0.35rem 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-right: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* In NORMAL mode, force controls to be fully expanded and hide toggle button */
        #pdfViewerSection:not(.is-fullscreen) #pdfControlsWrapper {
            max-width: 500px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            pointer-events: auto !important;
        }
        #pdfViewerSection:not(.is-fullscreen) #toggleControlsBtn {
            display: none !important;
        }
    </style>
    
    <!-- Script to prevent white flash on load if dark mode is active -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

    <script>
        const GOOGLE_APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwpSJbh9epN2hiaC6ghl76vSR0ZKGamHAWz1LXaIRYM9_v3xc6Tyd3MppYAMZXOCIGn/exec"; 

        let parsedBooks = [];
        let filteredBooks = [];

        // DOM Elements
        const grid = document.getElementById('materialsGrid');
        const emptyState = document.getElementById('emptyState');
        const classFilter = document.getElementById('classFilter');
        const subjectFilter = document.getElementById('subjectFilter');
        const typeFilter = document.getElementById('typeFilter');
        const searchInput = document.getElementById('searchInput'); // New search input
        const countDisplay = document.getElementById('showingCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshIcon = document.getElementById('refreshIcon');
        
        // PDF Viewer Elements
        const pdfViewerSection = document.getElementById('pdfViewerSection');
        const pdfIframe = document.getElementById('pdfIframe');
        const pdfViewerTitle = document.getElementById('pdfViewerTitle');
        const closePdfBtn = document.getElementById('closePdfBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        
        // Expand/Collapse Controls Elements
        const pdfControlsWrapper = document.getElementById('pdfControlsWrapper');
        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const toggleControlsIcon = document.getElementById('toggleControlsIcon');
        let isControlsExpanded = true;
        
        // Zoom Elements
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
        const pdfZoomWrapper = document.getElementById('pdfZoomWrapper');

        let currentZoom = 1;
        const ZOOM_STEP = 0.25;
        const MAX_ZOOM = 3;  
        const MIN_ZOOM = 0.5;

        function capitalizeWords(str) {
            return str.replace(/\b\w/g, char => char.toUpperCase());
        }

        function populateFilters() {
            const classes = new Set();
            const subjects = new Set();
            const types = new Set();

            parsedBooks.forEach(book => {
                classes.add(capitalizeWords(book.className));
                subjects.add(capitalizeWords(book.subject));
                types.add(capitalizeWords(book.bookType));
            });

            const fillSelect = (selectEl, dataSet) => {
                const allOption = selectEl.options[0];
                selectEl.innerHTML = '';
                selectEl.appendChild(allOption);

                Array.from(dataSet).sort().forEach(value => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    selectEl.appendChild(option);
                });
            };

            const currentClass = classFilter.value;
            const currentSubject = subjectFilter.value;
            const currentType = typeFilter.value;

            fillSelect(classFilter, classes);
            fillSelect(subjectFilter, subjects);
            fillSelect(typeFilter, types);

            if (classes.has(currentClass)) classFilter.value = currentClass;
            if (subjects.has(currentSubject)) subjectFilter.value = currentSubject;
            if (types.has(currentType)) typeFilter.value = currentType;
        }

        function renderBooks() {
            grid.innerHTML = '';
            
            if (filteredBooks.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                
                filteredBooks.forEach((book, index) => {
                    const card = document.createElement('div');
                    card.className = 'glass-card rounded-xl sm:rounded-2xl flex flex-col h-full fade-in relative overflow-hidden group';
                    card.style.animationDelay = `${index * 0.05}s`;

                    let subjectIcon = 'fa-book';
                    const subLower = (book.subject || "").toLowerCase();
                    if(subLower.includes('math')) subjectIcon = 'fa-calculator';
                    else if(subLower.includes('science') || subLower.includes('physics') || subLower.includes('chemistry')) subjectIcon = 'fa-flask';
                    else if(subLower.includes('history') || subLower.includes('civics')) subjectIcon = 'fa-landmark';
                    else if(subLower.includes('biology')) subjectIcon = 'fa-leaf';
                    else if(subLower.includes('english')) subjectIcon = 'fa-language';

                    const thumbnailUrl = `https://drive.google.com/thumbnail?id=${book.id}&sz=w600`;

                    card.innerHTML = `
                        <!-- Thumbnail Section -->
                        <div class="relative w-full flex items-center justify-center bg-gray-50 dark:bg-slate-800/50 overflow-hidden flex-shrink-0 border-b border-gray-100 dark:border-slate-700">
                            <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500 z-20"></div>
                            <div class="absolute inset-0 flex items-center justify-center text-indigo-200 dark:text-indigo-900/50 min-h-[160px] sm:min-h-[240px]">
                                <i class="fa-solid fa-file-pdf text-4xl sm:text-6xl drop-shadow-sm"></i>
                            </div>
                            
                            <img src="${thumbnailUrl}" 
                                 alt="${book.chapter} thumbnail" 
                                 class="relative z-10 w-full h-auto object-contain transition-transform duration-500 group-hover:scale-105"
                                 onload="this.previousElementSibling.style.display='none'"
                                 onerror="this.style.display='none'">
                                 
                            <div class="absolute top-2 left-2 sm:top-3 sm:left-3 z-20">
                                <span class="bg-white/90 dark:bg-slate-800/90 backdrop-blur text-indigo-800 dark:text-indigo-300 text-[9px] sm:text-xs font-bold px-2 py-1 sm:px-3 sm:py-1.5 rounded-full flex items-center gap-1 shadow-sm border border-white/60 dark:border-slate-600">
                                    <i class="fa-solid fa-tag text-[8px] sm:text-[10px]"></i> 
                                    <span class="truncate max-w-[50px] sm:max-w-none inline-block align-bottom">${book.bookType || "Material"}</span>
                                </span>
                            </div>
                        </div>

                        <!-- Content Section -->
                        <div class="p-3 sm:p-5 flex flex-col flex-grow">
                            <h3 class="text-sm sm:text-lg font-bold text-gray-800 dark:text-gray-100 mb-2 sm:mb-3 leading-snug line-clamp-2" title="${book.chapter || "Untitled Document"}">${book.chapter || "Untitled Document"}</h3>
                            
                            <div class="flex flex-col gap-1.5 sm:gap-2 mt-auto mb-3 sm:mb-5 text-[10px] sm:text-sm text-gray-600 dark:text-gray-400 bg-gray-50/70 dark:bg-slate-800/70 p-2 sm:p-3 rounded-lg sm:rounded-xl border border-gray-100 dark:border-slate-700">
                                <div class="flex items-center gap-1.5 sm:gap-3">
                                    <div class="w-5 sm:w-6 text-center text-indigo-400 dark:text-indigo-500 bg-white dark:bg-slate-700 rounded-md shadow-sm py-0.5 sm:py-1 flex-shrink-0">
                                        <i class="fa-solid fa-school"></i>
                                    </div>
                                    <span class="font-medium truncate">${book.className || "General"}</span>
                                </div>
                                <div class="flex items-center gap-1.5 sm:gap-3">
                                    <div class="w-5 sm:w-6 text-center text-indigo-400 dark:text-indigo-500 bg-white dark:bg-slate-700 rounded-md shadow-sm py-0.5 sm:py-1 flex-shrink-0"><i class="fa-solid ${subjectIcon}"></i></div>
                                    <span class="truncate">${book.subject || "General"}</span>
                                </div>
                            </div>
                            
                            <button class="open-book-btn w-full text-center bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-600 dark:hover:bg-indigo-600 border border-indigo-100 dark:border-indigo-800/50 hover:border-indigo-600 text-indigo-700 dark:text-indigo-300 hover:text-white font-semibold py-2 sm:py-2.5 rounded-lg sm:rounded-xl transition-all shadow-sm group-hover:shadow-md active:scale-95 touch-manipulation text-xs sm:text-base flex justify-center items-center gap-2">
                                <span>Open Book</span>
                                <i class="fa-solid fa-book-open opacity-70 group-hover:opacity-100 transition-opacity"></i>
                            </button>
                        </div>
                    `;
                    
                    card.querySelector('.open-book-btn').addEventListener('click', () => {
                        openPdfViewer(book.url, book.chapter || "Untitled Document");
                    });

                    grid.appendChild(card);
                });
            }
            countDisplay.textContent = filteredBooks.length;
        }

        /* --- PDF Viewer Expand/Collapse Controls Logic --- */

        function setControlsExpanded(expand) {
            isControlsExpanded = expand;
            if (expand) {
                pdfControlsWrapper.classList.remove('max-w-0', 'opacity-0', 'scale-90');
                pdfControlsWrapper.classList.add('max-w-[500px]', 'opacity-100', 'scale-100');
                toggleControlsIcon.classList.replace('fa-bars', 'fa-chevron-right');
            } else {
                pdfControlsWrapper.classList.add('max-w-0', 'opacity-0', 'scale-90');
                pdfControlsWrapper.classList.remove('max-w-[500px]', 'opacity-100', 'scale-100');
                toggleControlsIcon.classList.replace('fa-chevron-right', 'fa-bars');
            }
        }

        toggleControlsBtn.addEventListener('click', () => {
            setControlsExpanded(!isControlsExpanded);
        });

        /* --- PDF Viewer & Zoom Logic --- */
        
        function updateZoomUI() {
            pdfZoomWrapper.style.width = `${currentZoom * 100}%`;
            pdfZoomWrapper.style.height = `${currentZoom * 100}%`;
            zoomLevelDisplay.textContent = `${Math.round(currentZoom * 100)}%`;
        }

        zoomInBtn.addEventListener('click', () => {
            if (currentZoom < MAX_ZOOM) {
                currentZoom += ZOOM_STEP;
                updateZoomUI();
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (currentZoom > MIN_ZOOM) {
                currentZoom -= ZOOM_STEP;
                updateZoomUI();
            }
        });

        function openPdfViewer(url, title) {
            let embedUrl = url;
            if (url.includes('drive.google.com/file/d/')) {
                embedUrl = url.replace(/\/view.*$/, '/preview');
            } else if (!url.includes('/preview')) {
                embedUrl += '/preview'; 
            }
            
            pdfViewerTitle.textContent = title;
            pdfIframe.src = embedUrl;
            
            currentZoom = 1;
            updateZoomUI();

            setControlsExpanded(true); // Always start with tools fully expanded
            
            pdfViewerSection.classList.remove('hidden');
            pdfViewerSection.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        closePdfBtn.addEventListener('click', () => {
            pdfViewerSection.classList.add('hidden');
            pdfViewerSection.classList.remove('flex');
            document.body.style.overflow = ''; 
            pdfIframe.src = ''; 
            
            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                exitFullscreen();
            }
        });

        /* --- Fullscreen API Logic --- */
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                enterFullscreen(pdfViewerSection);
            } else {
                exitFullscreen();
            }
        });

        function enterFullscreen(element) {
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) {
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) { 
                element.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { 
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        const handleFullscreenChange = () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (isFullscreen) {
                fullscreenIcon.classList.replace('fa-expand', 'fa-compress');
                
                // Add fullscreen UI class to hide title bar and setup floating UI
                pdfViewerSection.classList.add('is-fullscreen');
                
                // Auto-collapse tools when entering full screen for true distraction-free reading
                setControlsExpanded(false);
            } else {
                fullscreenIcon.classList.replace('fa-compress', 'fa-expand');
                
                // Return to normal header UI
                pdfViewerSection.classList.remove('is-fullscreen');
                setControlsExpanded(true);
            }
        };

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        /* --- Filters & Search Logic --- */

        function applyFilters() {
            const sClass = classFilter.value;
            const sSubject = subjectFilter.value;
            const sType = typeFilter.value;
            const sQuery = searchInput.value.toLowerCase().trim();

            filteredBooks = parsedBooks.filter(book => {
                const bClass = capitalizeWords(book.className || "");
                const bSubject = capitalizeWords(book.subject || "");
                const bType = capitalizeWords(book.bookType || "");
                const bTitle = (book.chapter || "").toLowerCase();

                const matchClass = sClass === 'all' || bClass === sClass;
                const matchSubject = sSubject === 'all' || bSubject === sSubject;
                const matchType = sType === 'all' || bType === sType;
                const matchSearch = sQuery === '' || bTitle.includes(sQuery);
                
                return matchClass && matchSubject && matchType && matchSearch;
            });

            renderBooks();
        }

        function resetFilters() {
            classFilter.value = 'all';
            subjectFilter.value = 'all';
            typeFilter.value = 'all';
            searchInput.value = '';
            applyFilters();
        }

        classFilter.addEventListener('change', applyFilters);
        subjectFilter.addEventListener('change', applyFilters);
        typeFilter.addEventListener('change', applyFilters);
        searchInput.addEventListener('input', applyFilters); // Trigger search on every keystroke

        async function fetchDriveData() {
            refreshIcon.classList.add('animate-spin-custom');
            refreshBtn.classList.add('opacity-80', 'cursor-not-allowed');
            refreshBtn.disabled = true;
            
            try {
                const response = await fetch(GOOGLE_APPS_SCRIPT_WEB_APP_URL);
                const data = await response.json(); 
                
                parsedBooks = data; 
                populateFilters();
                applyFilters();

            } catch (error) {
                console.error("Error fetching data:", error);
                emptyState.innerHTML = `
                    <div class="bg-red-100 p-4 rounded-full mb-4">
                        <i class="fa-solid fa-circle-xmark text-4xl text-red-500"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-700 mb-1">Connection Error</h3>
                    <p class="text-gray-600 text-sm max-w-md">Failed to load files from Google Drive. Ensure your Apps Script is deployed with access set to "Anyone".</p>
                `;
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
            } finally {
                refreshIcon.classList.remove('animate-spin-custom');
                refreshBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                refreshBtn.disabled = false;
            }
        }

        refreshBtn.addEventListener('click', fetchDriveData);

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        function updateThemeUI(isDark) {
            if (isDark) {
                themeIcon.className = 'fa-solid fa-sun text-lg sm:text-base text-yellow-400';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.className = 'fa-solid fa-moon text-lg sm:text-base';
                themeText.textContent = 'Dark Mode';
            }
        }

        updateThemeUI(document.documentElement.classList.contains('dark'));

        themeToggleBtn.addEventListener('click', () => {
            const htmlElement = document.documentElement;
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        });

        window.addEventListener('DOMContentLoaded', fetchDriveData);
    </script>
</body>
</html>
